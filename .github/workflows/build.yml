name: Build Mobile Balatro Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web UI Frontend
        run: |
          cd ui
          npm ci
          npm run build --if-present || true

      - name: Generate Missing Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5

      - name: Strip Signing Blocks From Code
        run: |
          # Use script commands to delete the strict desktop signing properties requirements from the configuration files
          sed -i '/BALATRO_SIGNING_PROPERTIES/d' app/build.gradle || true
          sed -i '/signingConfigs/,/}/d' app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          sed -i 's/signingConfig signingConfigs.config/signingConfig signingConfigs.debug/g' app/build.gradle || true

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          # Compile the application while forcing the system to completely skip code testing metrics
          ./gradlew :app:assembleDebug -x lint -x test --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-balatro-manager-final-apk
          path: app/build/outputs/apk/debug/*.apk
