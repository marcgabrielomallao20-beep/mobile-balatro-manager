name: Build Mobile Balatro Manager APK

on:
  workflow_dispatch: # Allows you to manually trigger the build from your phone

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web UI Frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build Android Debug APK
        run: |
          ./gradlew :app:assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-balatro-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
