name: Build Mobile Balatro Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web UI Frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: Generate Missing Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug
